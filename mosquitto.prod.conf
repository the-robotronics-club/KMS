# Production broker: credentials required, role-based ACLs.
#
# The password file is NOT committed. docker-compose.prod.yml generates it at
# boot from $MQTT_USERNAME / $MQTT_PASSWORD (see the mosquitto service command),
# so git never sees a hash and rotating credentials is an env change plus a
# restart.
#
# Sensitive topic expectations (firmware: kms_enclosure/kms_enclosure.ino):
#   backend publishes    device/<id>/access/command, device/<id>/rack/command
#   device publishes     device/<id>/access/proximity_code, access/event,
#                        access/tamper_event, power/telemetry, esp32/heartbeat

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/mosquitto.acl