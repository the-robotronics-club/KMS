# Compose loads this file automatically on top of docker-compose.yml, so anything
# uncommented here changes `docker compose up` for everyone. It is intentionally
# empty: the base file is self-sufficient and needs no local edits.
#
# Use it for machine-local tweaks you do not want to commit — or uncomment the
# block below when you want the backend on the host (for a debugger or a REPL)
# while the rest of the stack stays in compose:
#
#   docker compose up --no-deps postgres redis mosquitto frontend
#   cd backend && .venv/bin/uvicorn app.main:app --reload
#
# (--no-deps keeps compose from starting the containerised backend, which the
# frontend otherwise waits on.)
#
# services:
#   frontend:
#     environment:
#       # The /api rewrite runs inside this container, so it needs a name that
#       # resolves to the host. Docker Desktop provides it; Linux needs the
#       # extra_hosts line below.
#       INTERNAL_API_URL: http://host.docker.internal:8000
#     extra_hosts:
#       - "host.docker.internal:host-gateway"
