# Local development broker only. Anonymous access is acceptable here because
# docker-compose.yml publishes both listeners on 127.0.0.1, so nothing off this
# machine can reach them.
#
# Do not deploy this file. An anonymous broker reachable from a network lets
# anyone publish device/<id>/access/command and open a door. Production uses
# mosquitto.prod.conf, which requires credentials and enforces per-role ACLs.
#
# Testing real ESP32 enclosures over the LAN? They need a listener reachable
# from the LAN, which means authentication: run the broker with
# mosquitto.prod.conf and publish 1883 on all interfaces.

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
